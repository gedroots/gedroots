# Read-only mobile app. Generate the Xcode project with
# `xcodegen generate` after `./build-rust.sh` (see README.md).
name: GEDRoots
options:
  bundleIdPrefix: org.gedroots
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
targets:
  GEDRoots:
    type: application
    platform: iOS
    sources:
      - GEDRoots
      - path: Generated/gedroots_mobile.swift
    dependencies:
      - framework: Generated/GedrootsMobileFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    info:
      path: GEDRoots/Info.plist
      properties:
        CFBundleDisplayName: GEDRoots
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scan the pairing code shown by GEDRoots on your computer."
        NSLocalNetworkUsageDescription: "Receive your tree directly from GEDRoots on your computer."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gedroots.mobile
        OTHER_LDFLAGS: ["-lc++"]
        # build-rust.sh only builds the Apple silicon simulator slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
