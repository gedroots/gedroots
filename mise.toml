# Environnement de développement de GEDRoots : outils épinglés et tâches.
# Installer : `mise install` ; lister les tâches : `mise tasks`.
min_version = "2026.10.0"

[tools]
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy" }

[tasks.app]
description = "Lancer GEDRoots (optimisé) ; ex. `mise run app arbre.ged`"
run = "cargo run --release -p gedroots --"

[tasks.build]
description = "Compiler tout l'espace de travail"
run = "cargo build --workspace"

[tasks.test]
description = "Tests de la bibliothèque GEDCOM"
run = "cargo test -p gedcom"

[tasks.clippy]
description = "Clippy, avertissements bloquants"
run = "cargo clippy --workspace -- -D warnings"

[tasks.fmt]
description = "Formater le code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Vérifier le formatage"
run = "cargo fmt --all --check"

[tasks.ci]
description = "Toutes les vérifications de la CI"
depends = ["fmt:check", "test", "clippy"]

[tasks.bundle]
description = "Construire GEDRoots.app (macOS) ; options : --install, --dmg"
run = "packaging/macos/bundle.sh"

[tasks.install]
description = "Installer GEDRoots sur cette machine"
run = "{% if os() == 'macos' %}packaging/macos/bundle.sh --install{% else %}packaging/linux/install.sh{% endif %}"
run_windows = "cargo build --release -p gedroots"
