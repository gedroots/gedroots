# GEDRoots development environment: pinned tools and tasks.
# Install: `mise install`; list the tasks: `mise tasks`.
min_version = "2026.10.0"

[tools]
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy" }

[tasks.app]
description = "Run GEDRoots (optimized), e.g. `mise run app tree.ged`"
run = "cargo run --release -p gedroots --"

[tasks.build]
description = "Build the whole workspace"
run = "cargo build --workspace"

[tasks.test]
description = "Tests of the GEDCOM library and the app (translations included)"
run = "cargo test --workspace"

[tasks.clippy]
description = "Clippy, warnings as errors"
run = "cargo clippy --workspace -- -D warnings"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check the formatting"
run = "cargo fmt --all --check"

[tasks.ci]
description = "Every CI check"
depends = ["fmt:check", "test", "clippy"]

# `bundle` and the platform installers are file tasks in mise-tasks/.
[tasks.install]
description = "Install GEDRoots on this machine"
run = [{ task = "install:{{ os() }}" }]
run_windows = "cargo build --release -p gedroots"
