[package]
name = "gedroots"
version = "0.1.0"
edition = "2024"
description = "GEDRoots — logiciel de généalogie libre et local, GEDCOM 7"

[dependencies]
gpui-kit = "=0.8.1"
gedcom = { path = "../gedcom" }
lsp-types = "0.97"
# Déjà utilisée par GPUI : dimensions des images (recadrage) et décodage à la taille d'affichage.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
ureq = { version = "2", features = ["native-certs", "json"] }
serde_json = "1.0.154"
# Fichiers ouverts depuis le Finder, transmis à la boucle de l'app.
async-channel = "2"
imagesize = "0.14"
# Export GEDZIP (.gdz) : archive zip, gedcom.ged compressé, médias stockés tels quels.
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2"] }
