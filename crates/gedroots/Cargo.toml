[package]
name = "gedroots"
version = "2026.11.9"
edition = "2024"
description = "GEDRoots, free and local genealogy software (GEDCOM 7)"
repository.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "=0.8.1"
# Local time of the versions in File › Revert To › Browse All Versions… (already used by GPUI).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gedcom = { path = "../gedcom", features = ["serde"] }
lsp-types = "0.97"
# Already used by GPUI: image dimensions (cropping) and decoding at display size.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
ureq = { version = "2", features = ["native-certs", "json"] }
serde_json = "1.0.154"
# Files opened from the Finder, passed to the app's loop.
async-channel = "2"
# Interface translations (also used by gpui-component) and the system's preferred languages.
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
imagesize = "0.14"
# GEDZIP export (.gdz): zip archive, gedcom.ged compressed, media stored as is.
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2"] }
# AI agents: local MCP server (HTTP on 127.0.0.1), on its own thread.
rmcp = { version = "3.8.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1"
# Platform configuration folder (AI agents setting, recent files outside macOS).
dirs = "6"
# Mobile devices: one-way peer-to-peer sync, and the pairing QR code.
gedroots-sync = { path = "../sync" }
# Family books: typesetting with Typst, embedded.
gedroots-book = { path = "../book" }
gedroots-viz = { path = "../viz" }
qrcode = { version = "0.14", default-features = false }
tokio-util = "0.7.20"
hayro = "0.8.0"
similar = "2.7.0"
# Cursor install link (configuration in base64).
base64 = "0.22"
# Updates from the GitHub releases. Same version as the `vpk` packager in mise.release.toml.
velopack = "=1.2.161"
# Name and version of the operating system, for Help › Report an Issue (already used by velopack).
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
# Window of the native save dialogs with a format choice (`save_dialog.rs`); already used by GPUI.
raw-window-handle = "0.6"

# Recent files: the system's list on macOS (NSDocumentController)…
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# …and the Save panel with its Format pop-up (`save_dialog.rs`).
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSControl",
    "NSDocumentController",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSSavePanel",
    "NSButton",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSObject", "NSString", "NSURL"] }

# Save dialog with a format choice: the common dialog on Windows (same version as GPUI)…
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# …and the desktop portal on Linux (same version and runtime as GPUI).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "raw_handle", "wayland"] }
url = "2"

# Windows: icon of the executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
