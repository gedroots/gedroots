[package]
name = "gedcom"
version = "0.1.0"
edition = "2024"
description = "Lossless GEDCOM 7 reading/writing and typed views for GEDRoots"
repository.workspace = true
license.workspace = true

[dependencies]
rust-i18n = "4.2.4"
uuid = { version = "1.29", features = ["v4"] }
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", optional = true }

[features]
# Serialization of research data (the app's MCP server).
serde = ["dep:serde", "dep:schemars"]
