  fr: "Naissance de sa fille %{name}"
timeline.birth_child.u:
  en: "Birth of child %{name}"
  fr: "Naissance de son enfant %{name}"
timeline.death_child.m:
  en: "Death of son %{name}"
  fr: "Décès de son fils %{name}"
timeline.death_child.f:
  en: "Death of daughter %{name}"
  fr: "Décès de sa fille %{name}"
timeline.death_child.u:
  en: "Death of child %{name}"
  fr: "Décès de son enfant %{name}"
