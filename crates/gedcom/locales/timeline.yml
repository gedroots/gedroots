_version: 2
# Timeline of a person (crates/gedcom/src/analysis/timeline.rs).
timeline.value:
  en: "%{label}: %{value}"
  fr: "%{label} : %{value}"
timeline.with:
  en: "%{event} with %{name}"
  fr: "%{event} avec %{name}"
timeline.death_parent.m:
  en: "Death of father %{name}"
  fr: "Décès de son père, %{name}"
timeline.death_parent.f:
  en: "Death of mother %{name}"
  fr: "Décès de sa mère, %{name}"
timeline.death_parent.u:
  en: "Death of parent %{name}"
  fr: "Décès de son parent, %{name}"
timeline.birth_sibling.m:
  en: "Birth of brother %{name}"
  fr: "Naissance de son frère %{name}"
timeline.birth_sibling.f:
  en: "Birth of sister %{name}"
  fr: "Naissance de sa sœur %{name}"
timeline.birth_sibling.u:
  en: "Birth of sibling %{name}"
  fr: "Naissance de son frère ou sa sœur %{name}"
timeline.death_sibling.m:
  en: "Death of brother %{name}"
  fr: "Décès de son frère %{name}"
timeline.death_sibling.f:
  en: "Death of sister %{name}"
  fr: "Décès de sa sœur %{name}"
timeline.death_sibling.u:
  en: "Death of sibling %{name}"
  fr: "Décès de son frère ou sa sœur %{name}"
timeline.death_spouse.m:
