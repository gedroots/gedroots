# United Kingdom. Civil registration from 1 July 1837 in England and Wales (1855 in Scotland, 1864
# in Ireland) with the GRO indexes; parish registers from 1538; census every ten years from 1841,
# open after 100 years; national probate calendar from 1858.
format: 1
code: GB
name: United Kingdom
names: [United Kingdom, Royaume-Uni, England, Angleterre, Wales, Pays de Galles, Scotland, Écosse]
marriage_age:
  - { until: 1929, male: 14, female: 12 }
  - { from: 1929, male: 16, female: 16 }
records:
  - type: registration_index
    local_name: GRO indexes
    goals: [birth, marriage, death]
    from: 1837
    index: true
  - type: civil_registration
    local_name: civil registration certificates
    goals: [birth, marriage, death, parents]
    from: 1837
  - type: church_registers
    local_name: parish registers
    goals: [birth, marriage, death, parents]
    from: 1538
  - type: census
    local_name: census
    goals: [death, parents]
    years: [1841, 1851, 1861, 1871, 1881, 1891, 1901, 1911, 1921]
    public_after: 100
  - type: probate
    local_name: national probate calendar
    goals: [death]
    from: 1858
    extends_by: 2
