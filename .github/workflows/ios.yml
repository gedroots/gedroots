name: iOS

# Builds the iOS app (apps/ios) for the simulator, unsigned: the Rust core with its Swift
# bindings, then the Xcode project. Only when the app or its Rust core change; the Rust crates
# themselves are tested by the Test workflow.
on:
  pull_request:
    paths:
      - apps/ios/**
      - crates/mobile/**
      - .github/workflows/ios.yml
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - crates/mobile/**
      - .github/workflows/ios.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      # Deletes main's older caches of build outputs.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # No cache of the tools: they install in under a minute, and their cache took the room of
      # the build outputs below.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          cache: false
      # Saved by main only: a pull request's copy could only be read by that pull request, and
      # would take room from the caches every pull request shares.
      - name: Restore the crates and build outputs
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ github.job }}-ios-${{ hashFiles('mise.lock', 'Cargo.lock') }}
          restore-keys: ${{ github.job }}-ios-
      - name: XcodeGen
        run: brew install xcodegen
      - run: mise run ios:build
      - name: Save the crates and build outputs
        id: save
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Delete the older build outputs
        if: steps.save.outcome == 'success'
        run: mise run cache:prune "${{ github.job }}-ios-" "${{ steps.cache.outputs.cache-primary-key }}"
        env:
          GH_TOKEN: ${{ github.token }}
