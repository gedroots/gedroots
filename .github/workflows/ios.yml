name: iOS

# Builds the iOS app (apps/ios) for the simulator, unsigned: the Rust core with its Swift
# bindings, then the Xcode project. Only when the app or its Rust core change; the Rust crates
# themselves are tested by the Test workflow.
on:
  pull_request:
    paths:
      - apps/ios/**
      - crates/mobile/**
      - .github/workflows/ios.yml
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - crates/mobile/**
      - .github/workflows/ios.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      # Replaces main's cache of build outputs.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # No cache of the tools: they install in under a minute, and their cache took the room of
      # the build outputs below.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          cache: false
      # Saved by main only: a pull request's copy could only be read by that pull request, and
      # would take room from the caches every pull request shares.
      - name: Restore the crates and build outputs
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ios
      - name: XcodeGen
        run: brew install xcodegen
      - run: mise run ios:build
      # A cache cannot be overwritten: main's previous copy goes first.
      - name: Delete the previous build outputs
        if: github.ref == 'refs/heads/main'
        run: gh cache delete ios || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save the crates and build outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ios
