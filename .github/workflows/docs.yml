name: Docs
on:
  push:
    branches: [main]
    paths: [website/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Only Bun (website/mise.toml) is needed, not the Rust toolchain.
      MISE_DISABLE_TOOLS: rust
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          working_directory: website
      - run: bun install --frozen-lockfile && bun run build
        working-directory: website
        env:
          DOCS_SITE: https://gedroots.github.io
          DOCS_BASE: /gedroots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
