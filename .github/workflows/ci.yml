name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système de GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev libxcb1-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p gedcom
      - run: cargo clippy --workspace -- -D warnings

  macos-build:
    # App macOS (Apple Silicon) téléchargeable en .dmg, pour tester sans compiler.
    # Les minutes macOS comptent 10× sur un dépôt privé : seulement sur main,
    # ou à la demande (`gh workflow run ci.yml --ref <branche>`).
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Construire GEDRoots.app et GEDRoots.dmg
        run: packaging/macos/bundle.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GEDRoots-macos-arm64-${{ github.run_number }}
          path: target/release/GEDRoots.dmg
          retention-days: 14
