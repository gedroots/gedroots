name: Test

# Tools and commands come from mise.toml (and mise.lock): the workflow runs the same task as a
# local machine (`mise run ci`). The installers are built by the Release workflow.

# Pull requests are tested before they merge, and main after each merge: main's run saves the
# cache that every pull request restores (a pull request can only read caches saved on main).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No incremental compilation in CI: useless on a fresh machine, and it
  # bloats the target/ cache.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Replaces main's cache of build outputs.
      actions: write
    steps:
      # With the Atlas (crates/gedcom/atlas), embedded at build time.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev libxcb1-dev libvulkan-dev
      # No cache of the tools: Rust installs in about ten seconds, and its 0.7 GB took the room
      # of the build outputs below.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          cache: false
      # Downloaded crates and build outputs, one copy, replaced after each merge. Only main saves
      # it: a pull request's copy could only be read by that pull request, and those copies filled
      # the repository's 10 GB, evicting main's cache.
      - name: Restore the crates and build outputs
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}
      - run: mise run ci
      # A cache cannot be overwritten: main's previous copy goes first.
      - name: Delete the previous build outputs
        if: github.ref == 'refs/heads/main'
        run: gh cache delete "rust-${{ runner.os }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save the crates and build outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}
