name: Test

# Tools and commands come from mise.toml (and mise.lock): the workflow runs the same task as a
# local machine (`mise run ci`). The installers are built by the Release workflow.

# Pull requests are tested before they merge, and main after each merge: main's run saves the
# cache that every pull request restores (a pull request can only read caches saved on main).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No incremental compilation in CI: useless on a fresh machine, and it
  # bloats the target/ cache.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # With the Atlas (crates/gedcom/atlas), embedded at build time.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev libxcb1-dev libvulkan-dev
      # mise installs Rust with rustup: the toolchain goes into mise's data
      # folder, so that the mise-action cache keeps it.
      - name: Rust toolchain in the mise folder
        run: echo "MISE_RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          # Saved by main only, like the build outputs below.
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # Downloaded crates and build outputs: they follow Cargo.lock. Only main saves them: a
      # pull request's copy could only be read by that pull request, and those copies filled the
      # repository's 10 GB, evicting main's cache.
      - name: Restore the crates and build outputs
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: mise run ci
      - name: Save the crates and build outputs
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
