# Changelog (CHANGELOG.md and the release pull request), in mise's release format:
# https://github.com/jdx/mise/blob/main/cliff.toml
# Release notes on GitHub are written by communique (communique.toml) from the same history.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]($REPO/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") -%}
        {% if commit.scope -%}
    - {{self::commit(commit=commit)}}\
        {% endif -%}
    {% endfor -%}
    {% for commit in commits -%}
        {% if commit.scope -%}
        {% else -%}
    - {{self::commit(commit=commit)}}\
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New Contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  - @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]($REPO/pull/{{ contributor.pr_number }})\
    {% endif %}\
{% endfor %}
{% endif %}
{% macro commit(commit) -%}
{% if commit.scope %}**({{commit.scope}})** {% endif -%}
{% if commit.breaking %}**breaking** {% endif -%}
{{ commit.message | split(pat="\n") | first | trim | upper_first }} by\
{% if commit.remote.username %} @{{commit.remote.username}}\
{% else %} {{commit.author.name}}{% endif %} in\
{% if commit.remote.pr_number %} [#{{ commit.remote.pr_number }}]($REPO/pull/{{ commit.remote.pr_number }})\
{% else %} [{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})\
{%- endif %}
{% endmacro commit -%}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [{ pattern = '\$REPO', replace = "https://github.com/gedroots/gedroots" }]

[git]
# Conventional commit titles (`feat(places): …`, `fix: …`) are grouped; other titles go under
# “Changed”.
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  # The pull request number comes from GitHub (commit.remote.pr_number).
  { pattern = '\s*\(#([0-9]+)\)', replace = "" },
]
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^chore: release', skip = true },
  { message = "^Merge ", skip = true },
  { message = '^(chore|fix)\(deps\)', group = "<!-- 98 -->📦️ Dependency Updates", scope = "" },
  { message = '^feat', group = "<!-- 01 -->🚀 Features" },
  { message = '^fix', group = "<!-- 02 -->🐛 Bug Fixes" },
  { message = '^refactor', group = "<!-- 03 -->🚜 Refactor" },
  { message = '^doc', group = "<!-- 04 -->📚 Documentation" },
  { message = '^perf', group = "<!-- 05 -->⚡ Performance" },
  { message = '^style', group = "<!-- 06 -->🎨 Styling" },
  { message = '^test', group = "<!-- 07 -->🧪 Testing" },
  { message = '^(chore|ci|build)', group = "<!-- 09 -->⚙️ Miscellaneous Tasks" },
  { message = '^revert', group = "<!-- 10 -->◀️ Revert" },
  { message = '.*', group = "<!-- 00 -->🔄 Changed" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "gedroots"
repo = "gedroots"
